[project]
name = "llmlab"
version = "0.1.0"
description = "From 'Attention Is All You Need' to production-ready LLM engineering."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Stage 7+ (fine-tuning, evaluation). Install with: uv sync --extra hf
hf = ["transformers>=4.44", "datasets>=2.20", "peft>=0.12", "accelerate>=0.33"]
# Stage 8 (serving). Install with: uv sync --extra serve
serve = ["fastapi>=0.112", "uvicorn>=0.30", "pydantic>=2.8"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmlab"]

# CPU-only PyTorch locally and in CI (no NVIDIA GPU here). On Kaggle/Colab,
# use the preinstalled CUDA torch and `pip install -e . --no-deps` instead.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "stage0: environment and baseline",
    "stage1: language-modelling fundamentals",
    "stage2: attention",
    "stage3: original encoder-decoder Transformer",
    "stage4: GPT from scratch",
    "stage5: modern GPT + BPE",
    "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
